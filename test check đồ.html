<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiểm Tra Hàng Auth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    input[type="file"] {
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>👜 Kiểm Tra Hàng AUTH / FAKE</h2>
  <form id="verifyForm" enctype="multipart/form-data">
    <p>📸 Tải lên 3–5 ảnh của cùng một sản phẩm:</p>
    <input type="file" name="images" multiple accept="image/*" required />
    <br />
    <button type="submit">🚀 Kiểm Tra</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("verifyForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const files = e.target.elements["images"].files;
      if (files.length < 3 || files.length > 5) {
        alert("⚠️ Vui lòng tải lên từ 3 đến 5 ảnh.");
        return;
      }

      const formData = new FormData();
      for (let file of files) {
        formData.append("images", file);
      }

      try {
        const res = await fetch("http://localhost:5000/predict", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();
        const prob =
          data.average_probability !== undefined
            ? `${data.average_probability}%`
            : "N/A";

        let icon = "❓";
        if (data.result === "AUTHENTIC") icon = "✅";
        if (data.result === "FAKE") icon = "❌";

        document.getElementById("result").innerHTML = `${icon} Hàng ${data.result} (${prob})`;
      } catch (error) {
        document.getElementById("result").innerHTML =
          "❌ Lỗi khi kết nối tới server. Vui lòng kiểm tra Flask.";
      }
    });
  </script>
</body>
</html>
